name: Cricket SG statistics

# Primary publication requires the source-pinned approval in history-source.json.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Statistics publication channel
        required: true
        type: choice
        default: primary
        options:
          - primary
          - review

permissions:
  contents: read

concurrency:
  group: cricket-sg-statistics
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'fahadferoze88-dev/CricketSG' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: cricket-statistics-review
    steps:
      - name: Check out the reviewed default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Use Node.js LTS
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Verify publisher and finalized-score projection
        run: node --test standalone/publish-statistics.test.mjs standalone/finalized-stats.test.mjs standalone/statistics-preview.test.mjs

      - name: Verify the checked-in historical artifact
        run: |
          node --input-type=module <<'NODE'
          import { readPinnedHistory } from './standalone/publish-statistics.mjs';
          await readPinnedHistory('standalone/history.json.gz', 'standalone/history-source.json');
          console.log('Pinned historical review artifact verified.');
          NODE

      - name: Capture immutable results and atomically replace the approved snapshot
        env:
          CLOUDFLARE_D1_BACKUP_TOKEN: ${{ secrets.CLOUDFLARE_D1_BACKUP_TOKEN }}
          STATISTICS_CHANNEL: ${{ inputs.channel || 'primary' }}
        run: node standalone/publish-statistics.mjs standalone/history.json.gz standalone/history-source.json "$STATISTICS_CHANNEL"

      # Only immutable finalized match revisions are published. No checkpoint export or artifact upload.
