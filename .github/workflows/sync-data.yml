name: Sync data from MEGA

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-data-from-mega
  cancel-in-progress: false

jobs:
  sync-data:
    runs-on: ubuntu-latest
    env:
      MEGA_FOLDER_URL: "https://mega.nz/folder/rlAWQSLZ#nLAVvNeg05TeqrOGpmf8uQ"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install MEGA downloader
        run: |
          mkdir -p "$RUNNER_TEMP/mega-downloader"
          cd "$RUNNER_TEMP/mega-downloader"
          npm init -y
          npm install megajs@1.3.10

      - name: Download and update public data
        run: NODE_PATH="$RUNNER_TEMP/mega-downloader/node_modules" node scripts/download-mega-data.cjs

      - name: Commit data change
        run: |
          if git diff --quiet -- public/data.json; then
            echo "public/data.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json
          git commit -m "data: sync latest stats"
          git push
